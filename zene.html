<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animachina Stúdió - Zene Lejátszó</title>
<link rel="stylesheet" href="zene.css">
</head>
<body>
<div class="room">

  <!-- TV -->
  <div class="tv-wrap">
    <div class="tv-body">
      <div class="tv-screen-bezel">
        <div class="tv-screen" id="tvScreen">
          <div class="screen-scanlines"></div>
          <div class="screen-glow"></div>
          <div class="screen-fade" id="screenFade"></div>

          <div class="screen-idle" id="screenIdle">
            <div class="no-signal">NINCS JEL</div>
            <div class="hint">HELYEZZ BE EGY VHS KAZETTÁT</div>
          </div>

          <div class="screen-playing" id="screenPlaying">
            <div class="cover-bg" id="coverBg"></div>
            <div class="vinyl-wrap">
              <div class="vinyl" id="vinyl">
                <div class="vinyl-center">
                  <div class="vinyl-center-placeholder" id="vinylImg"></div>
                </div>
              </div>
            </div>
            <div class="song-info">
              <div class="song-title" id="songTitle">–</div>
              <div class="song-artist" id="songArtist">–</div>
              <div class="progress-bar-wrap">
                <div class="progress-bar-fill" id="progressBar"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="tv-bottom">
        <div class="tv-brand">Animachina Sound System</div>
        <div class="tv-indicator"></div>
        <div class="tv-knobs"><div class="tv-knob"></div><div class="tv-knob"></div></div>
      </div>
    </div>
    <div class="tv-legs"><div class="tv-leg"></div><div class="tv-leg"></div></div>
  </div>

  <!-- VCR -->
  <div class="vcr-wrap">
    <div class="vcr-body">
      <div class="vcr-top">
        <div class="vcr-slot" id="vcrSlot">
          <div class="vcr-slot-label">▶ VHS</div>
          <div class="vhs-in-slot" id="slotIndicator"></div>
        </div>
        <div class="vcr-display" id="vcrDisplay">12:00</div>
      </div>
      <div class="vcr-controls">
        <button class="vcr-btn" id="btnPlay"  onclick="togglePlay()">▶ INDÍTÁS</button>
        <!--<button class="vcr-btn" id="btnStop"  onclick="stopPlayback()">■ MEGÁLLÍTÁS</button>-->
        <button class="vcr-btn" id="btnRew"   onclick="rewindTape()">◀◀ VISSZA TEKERÉS</button>
        <button class="vcr-btn" id="btnFfw"   onclick="ffwTape()">ELŐRE TEKERÉS ▶▶</button>
        <button class="vcr-btn eject-btn"     onclick="ejectTape()">⏏ KIADÁS</button>
      </div>
      <div class="vcr-volume">
        <span class="vcr-volume-label">🔈 HANGERŐ</span>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80" oninput="setVolume(this.value)">
        <span class="volume-value" id="volumeValue">80%</span>
      </div>
      <div class="vcr-brand">Animachina Rádió</div>
    </div> <br><br> 
  </div>

  <!-- TABLE -->
  <div class="table-surface" id="tableTop">
    <div class="vhs-tape vhs-blue"    id="tape0" onclick="insertTape(0)">
      <div class="vhs-tooltip">Betölt: Dal 1</div>
      <div class="vhs-body">
        <div class="vhs-label"><div class="vhs-label-title" id="label0">Dal 1&#10;Előadó 1</div><div class="vhs-label-line"></div></div>
        <div class="vhs-window"><div class="vhs-reel"></div><div class="vhs-reel"></div></div>
        <div class="vhs-bottom-bar"><div class="vhs-tape-num">VOL.1</div></div>
      </div>
      <div class="vhs-shadow"></div>
    </div>

    <div class="vhs-tape vhs-red"   id="tape1" onclick="insertTape(1)">
      <div class="vhs-tooltip">Betölt: Dal 2</div>
      <div class="vhs-body">
        <div class="vhs-label"><div class="vhs-label-title" id="label1">Dal 2&#10;Előadó 2</div><div class="vhs-label-line"></div></div>
        <div class="vhs-window"><div class="vhs-reel"></div><div class="vhs-reel"></div></div>
        <div class="vhs-bottom-bar"><div class="vhs-tape-num">VOL.2</div></div>
      </div>
      <div class="vhs-shadow"></div>
    </div>

    <div class="vhs-tape vhs-purple"  id="tape2" onclick="insertTape(2)">
      <div class="vhs-tooltip">Betölt: Dal 3</div>
      <div class="vhs-body">
        <div class="vhs-label"><div class="vhs-label-title" id="label2">Dal 3&#10;Előadó 3</div><div class="vhs-label-line"></div></div>
        <div class="vhs-window"><div class="vhs-reel"></div><div class="vhs-reel"></div></div>
        <div class="vhs-bottom-bar"><div class="vhs-tape-num">VOL.3</div></div>
      </div>
      <div class="vhs-shadow"></div>
    </div>

    <div class="vhs-tape vhs-yellow" id="tape3" onclick="insertTape(3)">
      <div class="vhs-tooltip">Betölt: Dal 4</div>
      <div class="vhs-body">
        <div class="vhs-label"><div class="vhs-label-title" id="label3">Dal 4&#10;Előadó 4</div><div class="vhs-label-line"></div></div>
        <div class="vhs-window"><div class="vhs-reel"></div><div class="vhs-reel"></div></div>
        <div class="vhs-bottom-bar"><div class="vhs-tape-num">VOL.4</div></div>
      </div>
      <div class="vhs-shadow"></div>
    </div>

    <div class="vhs-tape vhs-green" id="tape4" onclick="insertTape(4)">
      <div class="vhs-tooltip">Betölt: Dal 5</div>
      <div class="vhs-body">
        <div class="vhs-label"><div class="vhs-label-title" id="label4">Dal 5&#10;Előadó 5</div><div class="vhs-label-line"></div></div>
        <div class="vhs-window"><div class="vhs-reel"></div><div class="vhs-reel"></div></div>
        <div class="vhs-bottom-bar"><div class="vhs-tape-num">VOL.5</div></div>
      </div>
      <div class="vhs-shadow"></div>
    </div>
  <div class="table-edge"></div>
</div>

<audio id="audio0" src="zene/track1.mp3"></audio>
<audio id="audio1" src="zene/track2.mp3"></audio>
<audio id="audio2" src="zene/track3.mp3"></audio>
<audio id="audio3" src="zene/track4.mp3"></audio>
<audio id="audio4" src="zene/track5.mp3"></audio>

<script>
const songs = [
  { title:"Csábít",      artist:"Zazaa", color:"slot-red",    labelColor:"#cc1111", cover:"zene/1.png" },
  { title:"Évek",        artist:"Zazaa", color:"slot-blue",   labelColor:"#1155cc", cover:"zene/2.png" },
  { title:"Kábulok",     artist:"Zazaa", color:"slot-green",  labelColor:"#118844", cover:"zene/3.png" },
  { title:"Angyal",      artist:"Zazaa", color:"slot-yellow", labelColor:"#ccaa00", cover:"zene/4.png" },
  { title:"Kék és Piros",artist:"Zazaa", color:"slot-purple", labelColor:"#882299", cover:"zene/5.png" },
  { title:"Oly Rég",     artist:"Zazaa", audio:"zene/track1.2.mp3", color:"slot-red",    labelColor:"#87433d" },
  { title:"Eretnek",     artist:"Zazaa", audio:"zene/track3.1.mp3", cover:"zene/3.1.png", color:"slot-blue", labelColor:"#486477" },
  { title:"Ördög",       artist:"Zazaa", audio:"zene/track4.1.mp3", color:"slot-purple", labelColor:"#765b7d" },
  // Új kazettához másold ezt a mintát, tedd a hangfájlt a zene/ mappába,
  // és állítsd be az audio útvonalát. Borítókép opcionális.
  // { title:"Új szám", artist:"Előadó", audio:"zene/track6.mp3", cover:"zene/6.png", color:"slot-blue", labelColor:"#486477" },
];

// A lejátszó az öt alap kazettán túl is automatikusan felépíti a kazettákat.
const tapePalette = ["red", "blue", "green", "yellow", "purple"];
const extraTapeShelf = document.getElementById('tableTop');
const makePart = (tag, className, parent, text) => {
  const part = document.createElement(tag);
  if (className) part.className = className;
  if (text !== undefined) part.textContent = text;
  parent.appendChild(part);
  return part;
};

songs.forEach((song, index) => {
  const audio = document.getElementById('audio' + index) || new Audio();
  audio.id = 'audio' + index;
  audio.src = song.audio || audio.getAttribute('src') || `zene/track${index + 1}.mp3`;
  audio.preload = 'none';
  if (!audio.isConnected) document.body.appendChild(audio);

  if (index < 5) return;

  const palette = tapePalette[index % tapePalette.length];
  song.color = song.color || `slot-${palette}`;
  song.labelColor = song.labelColor || '#486477';
  const tape = makePart('div', `vhs-tape vhs-${palette}`, extraTapeShelf);
  tape.id = 'tape' + index;
  tape.tabIndex = 0;
  tape.setAttribute('role', 'button');
  tape.setAttribute('aria-label', `Kazetta lejátszása: ${song.title} – ${song.artist}`);
  tape.addEventListener('click', () => insertTape(index));
  tape.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      insertTape(index);
    }
  });
  makePart('div', 'vhs-tooltip', tape, `Betölt: ${song.title}`);
  const body = makePart('div', 'vhs-body', tape);
  const label = makePart('div', 'vhs-label', body);
  const title = makePart('div', 'vhs-label-title', label, `${song.title}\n${song.artist}`);
  title.id = 'label' + index;
  makePart('div', 'vhs-label-line', label);
  const window = makePart('div', 'vhs-window', body);
  makePart('div', 'vhs-reel', window);
  makePart('div', 'vhs-reel', window);
  const bottom = makePart('div', 'vhs-bottom-bar', body);
  makePart('div', 'vhs-tape-num', bottom, `VOL.${index + 1}`);
  makePart('div', 'vhs-shadow', tape);
});

// Volume
const volumeSlider = document.getElementById('volumeSlider');
const volumeValue  = document.getElementById('volumeValue');
const coverBg      = document.getElementById('coverBg');

function setVolume(val){
  const v = parseInt(val)/100;
  document.querySelectorAll('audio').forEach(a=>a.volume=v);
  volumeValue.textContent = val+'%';
  volumeSlider.style.setProperty('--vol', val+'%');
}
setVolume(80);

songs.forEach((s,i) => {
  const el = document.getElementById('label'+i);
  if (el) el.textContent = s.title+'\n'+s.artist;
  const tip = document.querySelector('#tape'+i+' .vhs-tooltip');
  if (tip) tip.textContent = 'Betölt: '+s.title;
});

let currentTape=null, isPlaying=false, isPaused=false;
let progressTimer=null, clockTimer=null, busy=false;

const vinyl      = document.getElementById('vinyl');
const screenIdle = document.getElementById('screenIdle');
const screenPlay = document.getElementById('screenPlaying');
const screenFade = document.getElementById('screenFade');
const vcrDisplay = document.getElementById('vcrDisplay');
const slotInd    = document.getElementById('slotIndicator');
const progressBar= document.getElementById('progressBar');
const btnPlay    = document.getElementById('btnPlay');

function startClock(){
  clearInterval(clockTimer);
  clockTimer=setInterval(()=>{
    if(!isPlaying&&!isPaused){
      const n=new Date();
      vcrDisplay.textContent=n.getHours().toString().padStart(2,'0')+':'+n.getMinutes().toString().padStart(2,'0');
    }
  },1000);
}
startClock();

const getAudio=i=>document.getElementById('audio'+i);

function insertTape(index){
  if(busy) return;
  if(currentTape===index&&(isPlaying||isPaused)) return;
  if(currentTape!==null&&currentTape!==index){ ejectAndInsert(index); return; }
  if(currentTape===index) return;

  busy=true;
  startPlayback(index);
  currentTape=index;
  slotInd.className='vhs-in-slot visible '+songs[index].color;
  slotInd.textContent=songs[index].title.substring(0,12);
  busy=false;
}

function ejectAndInsert(newIndex){
  stopPlayback(false);
  setTimeout(()=>doEject(()=>insertTape(newIndex)),400);
}

function doEject(cb){
  if(currentTape===null){if(cb)cb();return;}
  busy=true;
  currentTape=null;
  slotInd.className='vhs-in-slot';
  slotInd.textContent='';
  fadeScreen(true,()=>{ screenPlay.classList.remove('active'); screenIdle.style.display=''; coverBg.classList.remove('visible'); fadeScreen(false); });
  setTimeout(()=>{ busy=false; if(cb)cb(); },420);
}

function startPlayback(index){
  const audio=getAudio(index);
  audio.currentTime=0;
  audio.volume = parseInt(volumeSlider.value)/100;
  document.getElementById('songTitle').textContent=songs[index].title;
  document.getElementById('songArtist').textContent=songs[index].artist;
  document.getElementById('vinylImg').style.background=songs[index].labelColor;
  // Cover image
  coverBg.classList.remove('visible');
  if(songs[index].cover){
    coverBg.style.backgroundImage='url('+songs[index].cover+')';
    setTimeout(()=>coverBg.classList.add('visible'),200);
  } else {
    coverBg.style.backgroundImage='none';
  }
  progressBar.style.width='0%';
  // Start playing immediately (VHS effect already played during insertTape animation)
  screenIdle.style.display='none';
  screenPlay.classList.add('active');
  audio.play().catch(()=>{});
  vinyl.classList.add('spinning');
  isPlaying=true; isPaused=false;
  btnPlay.textContent='⏸ MEGÁLLÍTÁS'; btnPlay.classList.add('active');
  vcrDisplay.textContent='INDÍTÁS';
  clearInterval(progressTimer);
  progressTimer=setInterval(()=>{ if(audio.duration) progressBar.style.width=(audio.currentTime/audio.duration*100)+'%'; },500);
  audio.onended=()=>onSongEnd(index);
}

function onSongEnd(index){
  isPlaying=false; isPaused=false;
  vinyl.classList.remove('spinning');
  clearInterval(progressTimer);
  progressBar.style.width='100%';
  btnPlay.textContent='▶ INDÍTÁS'; btnPlay.classList.remove('active');
  vcrDisplay.textContent='MEGÁLLÍTÁS';
  setTimeout(()=>doEject(null),1000);
}

function togglePlay(){
  if(currentTape===null) return;
  const audio=getAudio(currentTape);
  if(isPlaying&&!isPaused){
    audio.pause(); vinyl.classList.remove('spinning');
    isPlaying=false; isPaused=true;
    btnPlay.textContent='▶ INDÍTÁS'; btnPlay.classList.remove('active');
    vcrDisplay.textContent='MEGÁLLÍTÁS';
  } else if(isPaused){
    audio.play().catch(()=>{}); vinyl.classList.add('spinning');
    isPlaying=true; isPaused=false;
    btnPlay.textContent='⏸ MEGÁLLÍTÁS'; btnPlay.classList.add('active');
    vcrDisplay.textContent='INDÍTÁS';
  }
}

function stopPlayback(doReset=true){
  if(currentTape===null) return;
  const audio=getAudio(currentTape);
  audio.pause(); audio.currentTime=0; audio.onended=null;
  vinyl.classList.remove('spinning');
  isPlaying=false; isPaused=false;
  clearInterval(progressTimer);
  progressBar.style.width='0%';
  if(doReset){ btnPlay.textContent='▶ INDÍTÁS'; btnPlay.classList.remove('active'); vcrDisplay.textContent='MEGÁLLÍTÁS'; }
}

function ejectTape(){
  if(currentTape===null||busy) return;
  stopPlayback(); setTimeout(()=>doEject(null),200);
}

function rewindTape(){
  if(currentTape===null) return;
  const audio=getAudio(currentTape); const was=isPlaying;
  if(was){audio.pause(); vinyl.classList.remove('spinning');}
  vcrDisplay.textContent='REW';
  screenPlay.classList.add('rewinding');
  const t=setInterval(()=>{
    audio.currentTime=Math.max(0,audio.currentTime-3);
    if(audio.duration) progressBar.style.width=(audio.currentTime/audio.duration*100)+'%';
  },100);
  setTimeout(()=>{
    clearInterval(t); screenPlay.classList.remove('rewinding');
    audio.currentTime=0; progressBar.style.width='0%';
    if(was){audio.play().catch(()=>{}); vinyl.classList.add('spinning'); vcrDisplay.textContent='INDÍTÁS';}
    else vcrDisplay.textContent='MEGÁLLÍTÁS';
  },1500);
}

function ffwTape(){
  if(currentTape===null) return;
  const audio=getAudio(currentTape); const was=isPlaying;
  if(was) audio.pause();
  vcrDisplay.textContent='FFW';
  const t=setInterval(()=>{
    if(audio.duration){ audio.currentTime=Math.min(audio.duration-1,audio.currentTime+5); progressBar.style.width=(audio.currentTime/audio.duration*100)+'%'; }
  },100);
  setTimeout(()=>{
    clearInterval(t);
    if(was){audio.play().catch(()=>{}); vinyl.classList.add('spinning'); vcrDisplay.textContent='INDÍTÁS';}
    else vcrDisplay.textContent='MEGÁLLÍTÁS';
  },1000);
}

function fadeScreen(toBlack,cb){
  if(toBlack){ screenFade.classList.add('on'); setTimeout(()=>{ if(cb)cb(); },420); }
  else { setTimeout(()=>{ screenFade.classList.remove('on'); if(cb)setTimeout(cb,420); },50); }
}
</script>
</body>
</html>
