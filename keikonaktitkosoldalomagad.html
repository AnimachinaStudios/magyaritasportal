<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Randi? 💕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink: #ff6b9d;
      --pink-light: #ffb6c1;
      --pink-dark: #e91e63;
      --rose: #ff8a9b;
      --cream: #fff5f7;
      --white: #ffffff;
      --text: #5a2a3a;
      --shadow: rgba(233, 30, 99, 0.25);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #fff0f5 0%, #ffe4ec 40%, #ffd6e7 100%);
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text);
      position: relative;
    }

    .hearts-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      font-size: 20px;
      color: var(--pink);
      opacity: 0.4;
      animation: float 12s linear infinite;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) rotate(0deg) scale(0.6);
        opacity: 0;
      }
      10% { opacity: 0.5; }
      90% { opacity: 0.4; }
      100% {
        transform: translateY(-10vh) rotate(360deg) scale(1);
        opacity: 0;
      }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .section {
      display: none;
      width: 100%;
      text-align: center;
      animation: fadeIn 0.6s ease;
    }

    .section.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-family: 'Pacifico', cursive;
      font-size: clamp(2rem, 6vw, 3.2rem);
      color: var(--pink-dark);
      margin-bottom: 12px;
      text-shadow: 2px 2px 0 var(--pink-light);
    }

    .subtitle {
      font-size: 1.2rem;
      color: var(--text);
      margin-bottom: 40px;
      opacity: 0.85;
    }

    .btn-group {
      display: flex;
      gap: 24px;
      justify-content: center;
      flex-wrap: wrap;
      position: relative;
      min-height: 80px;
    }

    .btn {
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 1.25rem;
      padding: 16px 42px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px var(--shadow);
      position: relative;
    }

    .btn-yes {
      background: linear-gradient(135deg, var(--pink), var(--pink-dark));
      color: white;
    }

    .btn-yes:hover {
      transform: scale(1.08);
      box-shadow: 0 12px 28px rgba(233, 30, 99, 0.4);
    }

    .btn-no {
      background: linear-gradient(135deg, #b0b0b0, #888);
      color: white;
      position: relative;
    }

    .btn-no:hover {
      background: linear-gradient(135deg, #999, #666);
    }

    .ideas-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .idea-card {
      background: white;
      border-radius: 20px;
      padding: 28px 20px;
      box-shadow: 0 10px 25px var(--shadow);
      cursor: pointer;
      transition: all 0.3s ease;
      border: 3px solid transparent;
      position: relative;
      overflow: hidden;
    }

    .idea-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--pink), var(--pink-dark));
      opacity: 0;
      transition: opacity 0.3s;
    }

    .idea-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 16px 35px rgba(233, 30, 99, 0.3);
    }

    .idea-card:hover::before,
    .idea-card.selected::before {
      opacity: 1;
    }

    .idea-card.selected {
      border-color: var(--pink);
      background: linear-gradient(180deg, #fff5f8, white);
    }

    .idea-emoji {
      font-size: 2.8rem;
      margin-bottom: 12px;
      display: block;
    }

    .idea-title {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text);
    }

    .schedule-box {
      background: white;
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow: 0 12px 30px var(--shadow);
      max-width: 420px;
      margin: 30px auto 0;
    }

    .selected-idea {
      font-size: 1.15rem;
      margin-bottom: 24px;
      padding: 12px 18px;
      background: var(--cream);
      border-radius: 12px;
      color: var(--pink-dark);
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 22px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
      font-size: 0.95rem;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #ffd6e0;
      border-radius: 14px;
      font-family: 'Quicksand', sans-serif;
      font-size: 1.05rem;
      color: var(--text);
      background: var(--cream);
      transition: border-color 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--pink);
      background: white;
    }

    .btn-send {
      background: linear-gradient(135deg, var(--pink), var(--pink-dark));
      color: white;
      width: 100%;
      margin-top: 10px;
      font-size: 1.2rem;
      padding: 16px;
    }

    .btn-send:hover {
      transform: scale(1.03);
    }

    .btn-send:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .success-msg {
      font-size: 1.3rem;
      color: var(--pink-dark);
      margin-bottom: 20px;
      font-weight: 600;
    }

    .heart-pulse {
      display: inline-block;
      animation: pulse 1s ease infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    .back-btn {
      margin-top: 24px;
      background: transparent;
      border: 2px solid var(--pink);
      color: var(--pink-dark);
      font-size: 0.95rem;
      padding: 10px 24px;
      box-shadow: none;
    }

    .back-btn:hover {
      background: var(--cream);
    }

    .final-msg {
      font-size: 1.4rem;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .final-msg span {
      color: var(--pink-dark);
      font-weight: 700;
    }

    @media (max-width: 600px) {
      .btn {
        font-size: 1.1rem;
        padding: 14px 32px;
      }
      .ideas-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="hearts-bg" id="heartsBg"></div>

  <div class="container">
    <div class="section active" id="questionSection">
      <h1>Eljössz velem randira? <span class="heart-pulse">💕</span></h1>
      <p class="subtitle">Egy kis romantika soha nem árt ✨</p>
      <div class="btn-group" id="btnGroup">
        <button class="btn btn-yes" id="yesBtn">Igen! 💖</button>
        <button class="btn btn-no" id="noBtn">Nem 🙈</button>
      </div>
    </div>

    <div class="section" id="ideasSection">
      <h1>Igen! 😍</h1>
      <p class="subtitle">Milyen program legyen a randin? Válassz egyet!</p>
      <div class="ideas-grid" id="ideasGrid">

      </div>
    </div>

    <div class="section" id="scheduleSection">
      <h1>Mikor? 📅</h1>
      <p class="subtitle">Válaszd ki a napot és azt hogy hánykor 🥰🥰!</p>
      <div class="schedule-box">
        <div class="selected-idea" id="selectedIdeaDisplay"></div>
        <div class="form-group">
          <label for="dateInput">📅 Nap</label>
          <input type="date" id="dateInput" required>
        </div>
        <div class="form-group">
          <label for="timeInput">⏰ Időpont</label>
          <input type="time" id="timeInput" required>
        </div>
        <button class="btn btn-send" id="sendBtn">Küldés 💌</button>
        <button class="btn back-btn" id="backToIdeas">← Vissza a programokhoz</button>
      </div>
    </div>

    <div class="section" id="confirmSection">
      <h1>Kész! <span class="heart-pulse">💖</span></h1>
      <p class="final-msg" id="finalMessage"></p>
      <p class="subtitle">Az e-mail megnyílt, ellenőrizd és küldd el! LOVE YOUU!!🥰🥰 🥰✨</p>
      <button class="btn btn-yes" onclick="location.reload()">Újra 🔄</button>
    </div>
  </div>

  <script>
    const MY_EMAIL = "kondix.dev@gmail.com";

    const ideas = [
      { emoji: "🎬", title: "Mozizás" },
      { emoji: "🌳", title: "Séta a szabadban" },
      { emoji: "☕", title: "Kávézás" },
      { emoji: "🧺", title: "Picnic" },
      { emoji: "🎮", title: "Játékest otthon" },
      { emoji: "🎶", title: "Koncert" },
      { emoji: "🖼️", title: "Múzeum" }
    ];

    let selectedIdea = null;

    function createHearts() {
      const bg = document.getElementById('heartsBg');
      const heartSymbols = ['❤️', '💕', '💖', '💗', '💓', '💞', '🩷'];
      for (let i = 0; i < 18; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
        heart.style.left = Math.random() * 100 + '%';
        heart.style.fontSize = (14 + Math.random() * 22) + 'px';
        heart.style.animationDuration = (8 + Math.random() * 10) + 's';
        heart.style.animationDelay = (Math.random() * 12) + 's';
        bg.appendChild(heart);
      }
    }

    const noBtn = document.getElementById('noBtn');
    const btnGroup = document.getElementById('btnGroup');

    function moveNoButton() {
      const maxX = window.innerWidth - noBtn.offsetWidth - 20;
      const maxY = window.innerHeight - noBtn.offsetHeight - 20;
      const x = Math.random() * maxX;
      const y = Math.random() * maxY;
      noBtn.style.position = 'fixed';
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
      noBtn.style.zIndex = '100';
      noBtn.style.margin = '0';
    }

    noBtn.addEventListener('mouseenter', moveNoButton);
    noBtn.addEventListener('click', (e) => {
      e.preventDefault();
      moveNoButton();
    });

    document.getElementById('yesBtn').addEventListener('click', () => {
      document.getElementById('questionSection').classList.remove('active');
      document.getElementById('ideasSection').classList.add('active');
      renderIdeas();
    });

    function renderIdeas() {
      const grid = document.getElementById('ideasGrid');
      grid.innerHTML = '';
      ideas.forEach((idea, index) => {
        const card = document.createElement('div');
        card.className = 'idea-card';
        card.innerHTML = `
          <span class="idea-emoji">${idea.emoji}</span>
          <div class="idea-title">${idea.title}</div>
        `;
        card.addEventListener('click', () => selectIdea(idea, card));
        grid.appendChild(card);
      });
    }

    function selectIdea(idea, cardEl) {
      selectedIdea = idea;
      document.querySelectorAll('.idea-card').forEach(c => c.classList.remove('selected'));
      cardEl.classList.add('selected');

      setTimeout(() => {
        document.getElementById('ideasSection').classList.remove('active');
        document.getElementById('scheduleSection').classList.add('active');
        document.getElementById('selectedIdeaDisplay').textContent = 
          `${idea.emoji} ${idea.title}`;
        
        const today = new Date().toISOString().split('T')[0];
        const dateInput = document.getElementById('dateInput');
        dateInput.min = today;
        dateInput.value = '';
        document.getElementById('timeInput').value = '';
      }, 300);
    }

    document.getElementById('backToIdeas').addEventListener('click', () => {
      document.getElementById('scheduleSection').classList.remove('active');
      document.getElementById('ideasSection').classList.add('active');
    });

    document.getElementById('sendBtn').addEventListener('click', () => {
      const date = document.getElementById('dateInput').value;
      const time = document.getElementById('timeInput').value;

      if (!date || !time) {
        alert('Kérlek válassz napot és időpontot is! 💕');
        return;
      }

      if (!selectedIdea) {
        alert('Valami hiba történt, próbáld újra!');
        return;
      }

      const dateObj = new Date(date + 'T00:00:00');
      const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
      const niceDate = dateObj.toLocaleDateString('hu-HU', options);

      const subject = encodeURIComponent('Randira jelentkezés 💕');
      const body = encodeURIComponent(
`Szia! 💖

Eljövök veled randira!

Program: ${selectedIdea.emoji} ${selectedIdea.title}
Nap: ${niceDate}
Időpont: ${time}

Várlak! 😘🥰`
      );

      window.location.href = `mailto:${MY_EMAIL}?subject=${subject}&body=${body}`;

      document.getElementById('scheduleSection').classList.remove('active');
      document.getElementById('confirmSection').classList.add('active');
      document.getElementById('finalMessage').innerHTML = 
        `A kiválasztott program: <span>${selectedIdea.emoji} ${selectedIdea.title}</span><br>
         Időpont: <span>${niceDate} ${time}</span>`;
    });

    createHearts();
  </script>
</body>
</html>
